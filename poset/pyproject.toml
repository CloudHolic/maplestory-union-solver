[project]
name = "poset"
version = "0.1.0"
description = "POSET: Polyomino-set State Embedding for Trees - branching policy for the MapleStory Union solver"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "CloudHolic", email = "cloudholic@pm.me" }]
dependencies = [
    "huggingface-hub>=1.14.0",
    "numpy>=2.4.4",
    "onnxruntime-gpu>=1.26.0",
    "safetensors>=0.7.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
training = [
    "pyarrow>=24.0.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poset"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src", "/training", "/scripts", "/tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
