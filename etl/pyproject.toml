[project]
name = "etl"
version = "0.1.0"
description = "ETL: solver JSONL traces -> parquet -> HF Hub"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CloudHolic", email = "cloudholic@pm.me" }]
dependencies = [
    "huggingface-hub>=1.14.0",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

